<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Prism Pop のアプリアイコン: 暗い背景に虹色の膜の泡 1 つ。主要な絵はマスカブルの安全域（中央 80%）に収める -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#0d0a1f" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="film" cx="42%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="0.7" stop-color="#5cc8ff" stop-opacity="0.1" />
      <stop offset="1" stop-color="#ff5ce1" stop-opacity="0.28" />
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6ff00" />
      <stop offset="0.3" stop-color="#3dffb8" />
      <stop offset="0.55" stop-color="#5cc8ff" />
      <stop offset="0.8" stop-color="#7c4dff" />
      <stop offset="1" stop-color="#ff5ce1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0d0a1f" />
  <circle cx="256" cy="256" r="230" fill="url(#glow)" />
  <circle cx="256" cy="256" r="150" fill="url(#film)" stroke="url(#rim)" stroke-width="14" />
  <ellipse cx="200" cy="196" rx="36" ry="22" transform="rotate(-35 200 196)" fill="#ffffff" fill-opacity="0.85" />
  <circle cx="318" cy="330" r="7" fill="#ffffff" fill-opacity="0.6" />
</svg>
